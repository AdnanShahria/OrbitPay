<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2309090B'/><circle cx='50' cy='50' r='24' fill='none' stroke='%23FFFFFF' stroke-width='8'/><circle cx='50' cy='50' r='7' fill='%23FFFFFF'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ORBIT Payment Hub — Multi-Tenant 3-Party MFS Verification Platform" />
    <meta name="theme-color" content="#FAFAFA" />
    <title>ORBIT Payment Hub</title>
    <!-- Inter & JetBrains Mono for BoardUI typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Default to White Theme unless user explicitly switched to Premium Black ('dark')
      (function () {
        try {
          var stored = window.localStorage.getItem('boardui:theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="h-full bg-background-full text-text-primary antialiased selection:bg-text-primary/15 selection:text-text-primary font-sans">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
