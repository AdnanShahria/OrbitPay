name = "orbitpay"
main = "backend/src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "orbit-pay"
database_id = "10db8119-0d62-47fb-a03c-ada1301b8e20"
migrations_dir = "backend/drizzle"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "orbitpay-r2"

[[send_email]]
name = "SEND_EMAIL"

# Optional KV binding for the Service Router (`backend/src/router/`)
# [[kv_namespaces]]
# binding = "KV"
# id = "00000000000000000000000000000000"

[triggers]
crons = [
  "* * * * *",  # Every minute: webhook retries, verification queue & checkout session expiry
  "0 * * * *",  # Every hour: expired router KV, old auth sessions & router logs cleanup
  "0 0 1 * *",  # Monthly (1st at 00:00 UTC): reset merchant wallet monthly volume quotas
]

[vars]
ENVIRONMENT = "production"
PRODUCTION_DOMAIN = "payment.orbitsaas.cloud"
